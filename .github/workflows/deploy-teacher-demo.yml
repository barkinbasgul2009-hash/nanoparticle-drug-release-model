name: Deploy Phase 7C Teacher Demo

# MANUAL-ONLY deployment of the Phase-7C immune-runtime teacher demo
# (simulator/teacher-demo.html) to the repository's single GitHub Pages site.
#
# This is SEPARATE from the main site workflow (.github/workflows/pages.yml), which
# is left untouched. The repo has ONE Pages site, so running this workflow TEMPORARILY
# replaces the currently deployed content with the teacher demo. Re-run the main
# "Deploy web tool to GitHub Pages" workflow (from main) afterwards to restore the
# original site — see the restore steps in the task report.
#
# It never triggers on push (so ordinary stage2 commits do not redeploy), never
# merges PR #3, never pushes to main, and changes no biological code / registries.

on:
  # Push trigger so the deployment runs automatically on the stage2 branch (a
  # workflow_dispatch workflow cannot be triggered from the UI unless it also
  # exists on the default branch; a push trigger works on any branch). Scoped to
  # the teacher-demo deployment files so ordinary unrelated commits do not redeploy.
  push:
    branches:
      - stage2/deep-scientific-evidence-review
    paths:
      - ".github/workflows/deploy-teacher-demo.yml"
      - "simulator/teacher-demo.html"
      - "simulator/src/**"
      - "simulator/data/**"
      - "simulator/tools/verify-teacher-demo-site.mjs"
  # Kept for future manual redeploys (e.g. to restore the demo after the main site).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments; do not cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage2/deep-scientific-evidence-review
        uses: actions/checkout@v4
        with:
          ref: stage2/deep-scientific-evidence-review

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare _site artifact (preserve simulator/ paths the demo imports + fetches)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/simulator
          # the demo imports ./src/** and fetches ./data/** relative to simulator/teacher-demo.html
          cp -R simulator/src  _site/simulator/src
          cp -R simulator/data _site/simulator/data
          cp    simulator/teacher-demo.html _site/simulator/teacher-demo.html
          # root entry point -> auto-redirect to the teacher demo (NOT the Phase-1 index)
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <meta http-equiv="refresh" content="0; url=./simulator/teacher-demo.html" />
            <title>Profile-B Simulator — Phase 7C Teacher Demo</title>
          </head>
          <body style="font:15px/1.6 system-ui,sans-serif;margin:3rem auto;max-width:40rem;padding:0 1rem">
            <h1>Profile-B Nanoparticle Simulator — Phase 7C</h1>
            <p>Redirecting to the Phase 7C immune-runtime teacher demo…</p>
            <p>If you are not redirected automatically, open
               <a href="./simulator/teacher-demo.html">./simulator/teacher-demo.html</a>.</p>
          </body>
          </html>
          HTML

      - name: Verify the artifact dependency graph (fail early on any missing/escaping file)
        run: node simulator/tools/verify-teacher-demo-site.mjs _site

      - name: Print artifact tree (demo-relevant)
        run: |
          echo "Directories:"; find _site -maxdepth 3 -type d | sort
          echo "Total files: $(find _site -type f | wc -l)"
          test -f _site/index.html
          test -f _site/simulator/teacher-demo.html
          test -d _site/simulator/src
          test -d _site/simulator/data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload _site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
