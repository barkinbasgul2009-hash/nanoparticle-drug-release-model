name: Deploy web tool to GitHub Pages

# Publishes web/index.html as the public website at
#   https://<owner>.github.io/<repo>/
# The web/ folder is uploaded as the site root, so index.html loads directly
# and every asset it uses is inline — nothing breaks under the /<repo>/ subpath.

on:
  push:
    branches: [main]
  # Allows manual deployment from the Actions tab (useful before merging).
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ as the site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
