name: tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  r-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      # The core library and test suite use only base R (no packages), so no
      # dependency installation step is needed.
      - name: Run test suite
        run: Rscript tests/run_tests.R

      - name: Run regression baseline (preserves existing behaviour)
        run: Rscript tests/regression/baseline_test.R

      - name: Run worked example
        run: Rscript examples/run_example.R

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Loads the actual model core from web/index.html and checks it against the
      # R-derived golden reference (tests/regression/baseline_release.json),
      # enforcing R<->JS numerical equivalence. No npm dependencies required.
      - name: Run JavaScript model + R<->JS equivalence tests
        run: node tests/js/model.test.mjs
